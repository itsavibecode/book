<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="version" content="0.1.16" />
<title>404 — BookHockeys</title>

<meta name="description" content="404. Touch grass." />
<meta name="theme-color" content="#39ff14" />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://bookhockeys.com/" />

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    background: #39ff14;
    font-family: 'Luckiest Guy', system-ui, sans-serif;
    letter-spacing: 1px;
    color: #0a0a0a;
    overflow: hidden;
  }

  /* Background video */
  .bg-video{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Same double-tint pattern as the home page so the neon-green brand
     colour still reads even over an arbitrary background clip. */
  .tint{
    position: fixed;
    inset: 0;
    background: #39ff14;
    opacity: 0.55;
    mix-blend-mode: multiply;
    z-index: 1;
    pointer-events: none;
  }
  .tint-2{
    position: fixed;
    inset: 0;
    background: #39ff14;
    opacity: 0.30;
    z-index: 2;
    pointer-events: none;
  }

  .wrap{
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 16px;
    text-align: center;
  }

  .four-oh-four{
    font-size: clamp(120px, 28vw, 320px);
    line-height: 0.9;
    text-shadow: 8px 10px 0 rgba(0,0,0,0.5);
  }

  .touch-grass{
    font-size: clamp(36px, 8vw, 96px);
    line-height: 1;
    text-shadow: 5px 6px 0 rgba(0,0,0,0.5);
  }

  .footer{
    position: fixed;
    left: 0; right: 0; bottom: 8px;
    z-index: 4;
    text-align: center;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    color: #0a0a0a;
    opacity: 0.6;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline preload="metadata">
    <source src="/404-bg.mp4" type="video/mp4">
  </video>

  <div class="tint"></div>
  <div class="tint-2"></div>

  <div class="wrap">
    <div class="four-oh-four" aria-hidden="true">404</div>
    <h1 class="touch-grass">TOUCH GRASS</h1>
  </div>

  <footer class="footer">v0.1.16</footer>
</body>
</html>
